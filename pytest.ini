[pytest]
minversion = 7.0
testpaths = tools
python_files = test_*.py
addopts = -v --tb=short
markers =
    hil: Hardware-in-the-Loop test
    suite1: Suite 1: Initialization, USB Detection, and DAP Info
    suite2: Suite 2: Low-Level SWD Protocol Bit-Bang & Timing
    suite3: Suite 3: RAM & Flash Access Operations
    suite4: Suite 4: CPU Execution Control & Debugging
    suite5: Suite 5: Flash Programming & Erase Operations
    suite6: Suite 6: Target Reset Signals & Vectors
    suite7: Suite 7: Real-Time Transfer (RTT) High-Speed Streaming
