# nice!nano v2 (nRF52840, Cortex-M4F)
[build]
target = "thumbv7em-none-eabihf"

[target.thumbv7em-none-eabihf]
# Uncomment to flash/debug through an already-attached SWD probe:
# runner = "probe-rs run --chip nRF52840_xxAA"
rustflags = [
  "-C", "linker=flip-link",
  "-C", "link-arg=--nmagic",
  "-C", "link-arg=-Tlink.x",
  "-C", "link-arg=-Tdefmt.x",
]

[env]
DEFMT_LOG = "info"

[alias]
rb = "run --release --bin"
bb = "build --release --bin"
